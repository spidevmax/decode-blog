# Continuous integration for DECODE.
#
# Two jobs on purpose, running in parallel. `check` is the fast feedback —
# lint, formatting, 185 unit tests and a build, all in well under a minute.
# `e2e` is slower and needs a browser downloaded, so it is kept separate: a
# formatting mistake should not wait behind a Chromium install, and a red tick
# tells you which kind of thing broke before you open the log.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the project is developed on. The README claims Node 20+, which
  # nothing verifies — widen this to a matrix if that claim needs to hold.
  NODE_VERSION: '26'

jobs:
  check:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Chromium is ~120MB and does not change between runs of the same
      # Playwright version, so it is worth keeping.
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System libraries live outside the cached directory, so they are still
      # needed on a cache hit.
      - name: Install browser dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Builds, serves, tests and tears down on its own — nothing to start.
      - name: Smoke suite
        run: npm run e2e
